<!DOCTYPE html>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; padding: 40px 20px;">

	<h1 style="font-size: 2.4rem; font-weight: bold; color: #222; margin-bottom: 8px; letter-spacing: -0.5px;">Our Beauty Salon</h1>

		<a href="#/treatments" style="text-decoration: none;">

			</div>
		</a>

		<a href="#/admin/appointments" style="text-decoration: none;">
			<div style="width: 260px; padding: 40px 32px; border: 1px solid #eee; border-radius: 8px; text-align: center; cursor: pointer; transition: box-shadow 0.15s;"
				onmouseover="this.style.boxShadow='0 4px 20px rgba(0,0,0,0.08)'"
				onmouseout="this.style.boxShadow='none'">

			</div>
		</a>

	</div>

</div>
