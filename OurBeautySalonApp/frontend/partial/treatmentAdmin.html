<h2>Treatments</h2>

<div ng-init="getAll();">

<a class="btn btn-salon" href="#/admin/treatments/add">Add new Treatment</a>

<div ng-if="treatmentList.length === 0" class="empty-state" style="margin-top: 30px;">
	<span class="dots">...</span>
	<p>No treatments yet. <a href="#/admin/treatments/add">Add the first treatment</a></p>
</div>

<table class="table table-hover" style="margin-top: 15px;" ng-if="treatmentList.length > 0">
	<thead>
		<tr>
			<th>Name</th>
			<th>Description</th>
			<th>Price</th>
			<th>Actions</th>
		</tr>
	</thead>
	<tbody>
		<tr ng-repeat="treatment in treatmentList">
			<td>{{ treatment.name }}</td>
			<td>{{ treatment.description }}</td>
			<td>{{ treatment.price }}</td>
			<td>
				<a class="btn btn-salon btn-sm" href="#/admin/treatments/{{ treatment.id }}">view</a>
				<a class="btn btn-salon btn-sm" href="#/admin/treatments/edit/{{ treatment.id }}" style="margin-left: 4px;">edit</a>
				<button class="btn btn-salon btn-sm" ng-click="remove(treatment.id)" style="margin-left: 4px;">delete</button>
			</td>
		</tr>
	</tbody>
</table>

<div ng-repeat="alert in alerts">
	<uib-alert type="{{alert.type}}" close="closeAlert($index)">{{alert.msg}}</uib-alert>
</div>

</div>
