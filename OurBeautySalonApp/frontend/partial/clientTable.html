<h2>Clients</h2>



<div ng-init="getAll();">




<div ng-if="clientList.length === 0" class="empty-state" style="margin-top:30px;">
	<span class="dots">...</span>
	<p>No clients yet. <a href="#/admin/clients/add">Add the first client</a></p>
</div>

<table class="table table-hover" style="margin-top:15px;" ng-if="clientList.length > 0">
	<thead>
		<tr>
					<th>First Name</th>
					<th>Last Name</th>
					<th>E-mail</th>
			<th>Actions</th>
		</tr>
	</thead>
	<tbody>
		<tr ng-repeat="client in clientList | filter:tableSearch">
						<td>{{ client.firstName }}</td>
						<td>{{ client.lastName }}</td>
						<td>{{ client.email }}</td>
			<td>
				<a class="btn btn-salon btn-sm" href="#/admin/clients/{{ client.id }}">view</a>
				
				
			</td>
		</tr>
	</tbody>
</table>


<div ng-repeat="alert in alerts">
	<uib-alert type="{{alert.type}}" close="closeAlert($index)">{{alert.msg}}</uib-alert>
</div>

</div>
